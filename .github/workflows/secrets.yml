name: Secret scan

# Bell publishes a credential-free receipt, and the whole claim rests on the
# CMC key never leaving the publisher process. A claim that important is worth
# a scanner rather than a convention: this reads the full history, not only the
# diff, so a key committed once and removed later is still found.

on:
  push:
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Pinned. A floating tag means the binary and its default rules can
      # change under a commit that did not, and a scan whose verdict moves
      # without the repository moving is one nobody can act on.
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
