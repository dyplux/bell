name: Secret scan

# Bell publishes a credential-free receipt, and the whole claim rests on the
# CMC key never leaving the publisher process. A claim that important is worth
# a scanner rather than a convention: this reads the full history, not only the
# diff, so a key committed once and removed later is still found.

on:
  push:
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
