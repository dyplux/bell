name: Bell quality gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public build
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Python tests
        run: python -m unittest discover -s bell/tests -p 'test_*.py' -q

      - name: Run browser-independent JavaScript tests
        run: node --test bell/tests/*.cjs

      - name: Check syntax and public receipts
        run: |
          python -m py_compile bell/*.py bell/tests/*.py
          python bell/verify_integrity_receipt.py
          python bell/verify_catalogue_receipt.py
          python bell/verify_submission.py
