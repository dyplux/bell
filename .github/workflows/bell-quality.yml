name: Bell quality gate

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public build
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Compile every module
        run: python -m py_compile bell/*.py bell/tests/*.py

      - name: Run the offline gate
        # `make check-offline` is the whole gate minus the browser: suites,
        # receipt re-derivation from the shipped inputs, and the release gate.
        # CI runs the offline variant deliberately - a red build should mean
        # this repository is wrong, never that a deployed site was briefly
        # unreachable.
        #
        # So CI enforces strictly LESS than the local gate: the deployed
        # interface is never verified here. `make check` covers it locally and
        # the job below covers it on a schedule. An earlier version of this
        # comment claimed a release job that did not exist in this file - a
        # comment describing a job nobody had written, in a repository whose
        # subject is surfaces that quietly disagree.
        run: make check-offline

      - name: Do the tests actually assert anything?
        # Six review rounds found six tests that could not fail, every one by a
        # person reading the file. This runs the suite with every assert*
        # counted and fails any test that reached the end having checked
        # nothing. It is not in check-offline because it runs the suite a second
        # time, and a gate that doubles in length stops being run.
        run: make audit-tests

  post-deployment-drift:
    # A source push is not a deployment. Comparing production on every push
    # races the independent Cloudflare publish and turns a healthy code check
    # red before deployment has a chance to finish. Run this explicitly after
    # publishing; the scheduled browser audit remains the independent monitor.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Is the deployed site this commit?
        # A push and its deploy are two events and this job runs between them,
        # so the check was going red on the clock rather than on the contents:
        # every push reported drift for the minute the edge took to catch up,
        # which is how a red signal stops being read. Drift that is real
        # survives the wait.
        run: python bell/verify_deployment_matches.py --wait 180

  deployed-interface:
    # The gap CI would otherwise leave: the offline job above never touches the
    # deployed site. This drives it with a real browser on a schedule and on
    # demand, and never on a push, so a site outage cannot redden a commit that
    # is fine.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright and a browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Verify the published surface, credential-free
        # No secret is configured for this workflow and none is needed: the
        # receipt Bell publishes is credential-free by construction, so CI can
        # check it the same way any reader can. This asserts the live receipt
        # was produced by THIS repository's rule version and that at least one
        # reference carries a published comparison - so a scan that silently
        # reverted to refusing everything reddens CI rather than waiting to be
        # noticed.
        run: PYTHONPATH=bell python bell/verify_public_surface.py

      - name: Audit the deployed interface
        run: PYTHONPATH=bell python bell/verify_public_browser.py --channel ""

  dated-series:
    # The history was eleven observations, nine of them on one day, because it
    # was appended by hand from a machine that had to be awake. A series with
    # that shape cannot answer "did this change last week", which is the whole
    # point of a dated receipt.
    #
    # No secret is needed. The receipt Bell publishes is credential-free, so the
    # series is built from the same bytes any reader can fetch. The script
    # appends only when `observed_at` is new: if the publisher has not run, the
    # live receipt still carries its previous timestamp, and writing that again
    # would manufacture an observation nobody made.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Append the published observation
        run: PYTHONPATH=bell python bell/append_history.py

      - name: Commit only when the series actually grew
        run: |
          if git diff --quiet; then
            echo "no new observation today; nothing to commit"
            exit 0
          fi
          # The new gzip archive is a tracked file as soon as it is staged.
          # Update the published count from that staged tree, then stage the
          # generated copy. This runs after each observation so the next
          # offline gate does not see a one-file drift.
          git add -A
          make sync-counts
          git add -A
          make check-offline
          git config user.name 'Dyplux'
          git config user.email 'admin@dyplux.com'
          # This step named the files by hand and the list was wrong twice.
          #
          # First, reference-deltas.json was written by append_history and never
          # staged, so the per-reference series could not grow by the automatic
          # path the documents describe: 15 observations in the history and one
          # step in the series, both of its points added by hand.
          #
          # Then, with that fixed, the job's first real commit left out
          # judge.html, README.md and bell/README.md, which append_history
          # restates the series length into. It landed a history of 16
          # observations beside prose saying 15, and `make check-offline` went
          # red on main, on a commit no human wrote. The job even printed
          # "restated the series length in judge.html, README.md, README.md"
          # into a log nobody reads.
          #
          # A list of filenames maintained beside a script that decides which
          # files to write is a second source of truth for the same fact. The
          # checkout is clean, so what changed is what the job did: stage all of
          # it, and let .gitignore be the only filter.
          git add -A
          git status --short
          git commit -m "Record the published observation of $(date -u +%Y-%m-%d)"
          # GitHub returned HTTP 500 for this push after the local commit had
          # succeeded. Retry transient remote errors, but first check whether
          # the remote accepted the commit despite returning an error. If main
          # advanced independently, rebase the generated observation before
          # retrying so the append does not get lost.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            git fetch origin main
            if git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "remote already contains the generated observation commit"
              exit 0
            fi
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "main advanced while this observation was being generated; rebasing"
              git rebase FETCH_HEAD
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 5))
              echo "push attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "could not publish the dated observation after 3 push attempts" >&2
          exit 1
