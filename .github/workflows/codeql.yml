name: CodeQL

# The quality gate proves this repository's own claims: it recomputes the
# published receipt and asserts the page says what the measurement says. It
# says nothing about whether the code that does it is safe to run. That is a
# different question and it needs a different tool.

on:
  push:
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
