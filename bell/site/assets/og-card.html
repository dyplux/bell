<!doctype html>
<html lang="en">

  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a0e14;color:#eaecef;font-family:Arial,Helvetica,sans-serif}body{position:relative;padding:54px 62px;background:radial-gradient(circle at 88% 8%,#182a45 0,#0a0e14 46%)}body:after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,transparent 0 68%,rgba(255,204,0,.07) 68% 68.2%,transparent 68.2% 100%);pointer-events:none}.brand{position:relative;z-index:1;display:flex;align-items:center;gap:18px;font-weight:700;letter-spacing:.04em}.bell{font-size:28px;letter-spacing:-.08em}.bell span{color:#ffcc00}.divider{height:24px;width:1px;background:#334152}.dyplux{font-size:20px;letter-spacing:.14em}.kicker{position:relative;z-index:1;margin-top:92px;color:#ffcc00;font-size:13px;font-weight:700;letter-spacing:.22em}.headline{position:relative;z-index:1;margin:18px 0 0;width:700px;font-size:64px;line-height:.98;letter-spacing:-.055em}.headline em{display:block;color:#ffcc00;font-style:normal}.sub{position:relative;z-index:1;width:560px;margin:25px 0 0;color:#9aa8b9;font-size:20px;line-height:1.35}.panel{position:absolute;z-index:1;right:62px;top:169px;width:315px;padding:22px;background:#111823;border:1px solid #334152;box-shadow:0 18px 50px rgba(0,0,0,.28)}.panel-head{color:#9aa8b9;font-size:11px;letter-spacing:.17em}.outcome{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid #27313d;font-size:14px;font-weight:700;letter-spacing:.08em}.outcome:last-child{border-bottom:0;padding-bottom:2px}.dot{width:8px;height:8px;background:#ffcc00;flex:0 0 auto}.outcome:first-of-type .dot{background:#ff6a67}.outcome:nth-of-type(3) .dot{background:#78aef5}.rule{position:relative;z-index:1;display:flex;gap:12px;align-items:center;margin-top:78px;color:#77879a;font-size:12px;letter-spacing:.12em}.rule span{display:block;width:32px;height:2px;background:#ffcc00}.foot{position:absolute;z-index:1;left:62px;right:62px;bottom:3   </style>
</head>
